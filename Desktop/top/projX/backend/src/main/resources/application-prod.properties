# Server port
server.port=8080

# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres:5432/g705
spring.datasource.username=g705user
spring.datasource.password=g705password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - auto-create/update tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson - serialize LocalDateTime as ISO-8601 string, not a timestamp array
# This matches the format sent by the Python sensor generator: "2024-01-01T12:00:00"
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# RabbitMQ (overridden by docker-compose env vars, but defined here as fallback)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
